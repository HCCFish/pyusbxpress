[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyusbxpress"
version = "0.1.3"
description = "Cross-platform Python client for Silicon Labs USBXpress devices (no vendor driver required)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "pyusbxpress contributors" }]
keywords = ["usbxpress", "silicon-labs", "c8051", "usb", "libusb", "winusb", "bootloader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "pyusb>=1.2.1",
    "libusb-package>=1.0.26",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/HCCFish/pyusbxpress"
Documentation = "https://github.com/HCCFish/pyusbxpress/blob/main/README.md"
Issues = "https://github.com/HCCFish/pyusbxpress/issues"

[project.scripts]
usbxpress = "usbxpress.cli:main"

[tool.setuptools.packages.find]
include = ["usbxpress*"]
